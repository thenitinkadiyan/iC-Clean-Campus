<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recycle Request - iC Clean Campus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="recycle-page">

        <h1>iC Clean Campus</h1>
        <h2>Recycle Request ♻️</h2>

        <p>
            Request collection of recyclable waste from your campus location.
        </p>

        <label>Waste Type</label>

        <div class="waste-options">

    <label class="waste-option">
        <input type="checkbox" value="Paper">
        📄 Paper
    </label>

    <label class="waste-option">
        <input type="checkbox" value="Plastic">
        🧴 Plastic
    </label>

    <label class="waste-option">
        <input type="checkbox" value="E-Waste">
        💻 E-Waste
    </label>

    <label class="waste-option">
        <input type="checkbox" value="Metal">
        🔩 Metal
    </label>

    <label class="waste-option">
        <input type="checkbox" value="Other">
        ♻️ Other
    </label>

</div>


        <label>Upload Photo</label>

        <input type="file" id="recyclePhoto" accept="image/*">


        <label>Pickup Location</label>

        <input type="text"
               id="recycleLocation"
               placeholder="Enter pickup location">


        <label>Description</label>

        <textarea id="recycleDescription"
                  placeholder="Describe the recyclable waste"></textarea>


        <button type="button" onclick="submitRecycleRequest()">
            ♻️ Submit Recycle Request
        </button>


        <a href="student-dashboard.html">
            ← Back to Dashboard
        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
