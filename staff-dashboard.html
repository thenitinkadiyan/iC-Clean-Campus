<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Panel - iC Clean Campus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="staff-dashboard">
        <h1>iC Clean Campus</h1>
        <h2>Cleaning Staff Panel</h2>
        <div class="staff-info">
            <h3>Hello, Staff 02 👋</h3>
            <span class="staff-status online">Online</span>
        </div>
        <div class="task-section">
            <h2>Today's Cleaning Task</h2>
            <div class="task-card">
                <h3>🗑️ Dustbin Overflow</h3>
                <p>
                    <strong>📍 Location:</strong><br>
                    Block 3, 5th Floor
                </p>
                <p>
                    <strong>🧹 Please clean the area.</strong>
                </p>
                <button type="button" onclick="viewTaskLocation()">
                    📍 Open Location
                </button>
                <label>📷 Upload After-Cleaning Photo</label>

                <input type="file" id="afterPhoto" accept="image/*">


                <button type="button" onclick="completeCleaning()">
                    ✅ Kaam Complete
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
