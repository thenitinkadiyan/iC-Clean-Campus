<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Panel - iC Clean Campus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="staff-dashboard">
        <h1>iC Clean Campus</h1>
        <h2>Cleaning Staff Panel</h2>
        <div class="staff-profile-card">
    <div class="staff-profile-info">
        <h2 id="staffName">Staff</h2>
        <p><strong>Staff ID:</strong> <span id="staffLoginId">-</span></p>
        <p><strong>Assigned Area:</strong> <span id="staffArea">-</span></p>
    </div>
</div>
       <div class="staff-info">
    <h3>Hello, <span id="staffGreetingName">Staff</span></h3>
    <span class="staff-status online">Online</span>
</div>
        <div class="task-section">
            <h2>Today's Cleaning Task</h2>
           <div class="task-card" id="staffTask">
            <p>Loading Cleaning Task</p>
           </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
async function loadStaffTask() {
    const user = JSON.parse(localStorage.getItem("loggedInUser"));

    if (!user || user.role !== "staff") {
        return;
    }

    const taskBox = document.getElementById("staffTask");

    try {
        const response = await fetch(
            `http://127.0.0.1:8001/cleaning-tasks/staff/${user.user_id}`
        );

        const data = await response.json();

        if (!data.task_id) {
            taskBox.innerHTML = `
                <p>No Cleaning Task</p>
                <small>Abhi koi cleaning task assigned nahi hai.</small>
            `;
            return;
        }

        taskBox.innerHTML = `
            <h3>${data.title}</h3>
            <p>${data.description || ""}</p>
            <p><strong>Location:</strong> ${data.location}</p>
            <p><strong>Area:</strong> ${data.area || "-"}</p>
            <p><strong>Priority:</strong> ${data.priority}</p>
            <p><strong>Status:</strong> ${data.status}</p>
        `;

    } catch (error) {
        console.error(error);
        taskBox.innerHTML = `
            <p>Unable to load cleaning task.</p>
        `;
    }
}

loadStaffTask();
</script>
</body>
</html>
