<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile - iC Clean Campus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="profile-page">

        <a href="student-dashboard.html" class="back-link">
            ← Back to Dashboard
        </a>

        <div class="profile-header">

            <div class="profile-avatar">
                👤
            </div>

            <div>
                <h1 id="profileName">Student</h1>
                <p id="profileGR">GR Number</p>
            </div>

        </div>


        <div class="reward-stats">

            <div class="reward-card">
                <div class="reward-icon">🏆</div>
                <h2 id="profilePoints">0</h2>
                <p>Total Points</p>
            </div>

            <div class="reward-card">
                <div class="reward-icon">🔥</div>
                <h2 id="profileStreak">0</h2>
                <p>Day Streak</p>
            </div>

            <div class="reward-card">
                <div class="reward-icon">🥇</div>
                <h2 id="profileRank">#--</h2>
                <p>Leaderboard Rank</p>
            </div>

        </div>


        <div class="profile-section">

            <h2>🎖️ Rewards & Achievements</h2>

            <div class="achievement-list">

                <div id="achievementList" class="achievement-list">Loading rewards</div>

            </div>

        </div>


        <div class="profile-section">

            <h2>🥇 Leaderboard</h2>

            <div id="leaderboardList">
                Loading leaderboard...
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
