<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - iC Clean Campus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="signup-box">

        <h1>Student Registration</h1>

        <p>Create your iC Clean Campus account</p>

        <input type="text" id="studentName" placeholder="Full Name">

        <input type="text" id="studentGR" placeholder="GR Number" maxlength="6">

        <input type="password" id="studentPassword" placeholder="Create Password" maxlength="8">

        <input type="password" id="confirmPassword" placeholder="Confirm Password" maxlength="8">

        <button onclick="registerStudent()">Create Account</button>

        <p>
            Already have an account?
            <a href="logins.html">Login</a>
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
