<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
</head>
<body>
   <div class="dashboard">
<h1>iC Clean Campus</h1>
<h2> Student Dashboard</h2>
<p> Welcome to your Dashboard </p>

    <div class="dashboard-cards">
        <div class="card">
            <h3>Report Garbage</h3>
            <p>Report a garbage or cleanliness issue on campus</p>
            <button>Report Now</button>
        </div>
<div class="card"> 
    <h3>My Complaints</h3>
    <p>View the complaints you have submitted</p>
    <button>View Complaints</button>
</div>
<div class="card">
    <h3>Complaints Status</h3>
    <p>Track the current status of your complaints</p>
    <button>Track Status</button>
</div>
    </div>
   </div> 


</body>
</html>
